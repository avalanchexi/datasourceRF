:root {

}

    --up: #ff686f; --down: #4bd49b; --warn: #f2ad46; --warn-soft: #3b2f12;
    --bond: #4b97ff; --equity: #b78af5; --commodity: #f2ad46;
    --ok: #5ce1ed; --bad: #ff686f; --cand: #f2ad46; --neutral: #7f97b5;
    --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500; --cat5: #9085e9;

}

  --bg: #031227; --panel: #0b2040; --muted: #142f50; --raised: #0f2749;

  --ok: #5ce1ed; --bad: #ff686f; --cand: #f2ad46; --neutral: #7f97b5;
  --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500; --cat5: #9085e9;
  --shadow: 0 18px 54px rgb(0 7 20 / 45%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--body); font: 14px/1.55 var(--sans); }
body { min-width: 320px; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: 16px; top: -60px; padding: 8px 12px; background: var(--ink); color: var(--bg); z-index: 50; }
.skip:focus { top: 8px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em; }
.num { font-variant-numeric: tabular-nums; }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.dim { color: var(--dim); }
h1, h2, h3 { color: var(--ink); text-wrap: balance; margin: 0; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center;
  padding: 10px 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px); }
.brand { display: flex; flex-direction: column; min-width: 150px; }
.brand b { color: var(--ink); font-size: 15px; }
.idfacts { display: flex; flex-wrap: wrap; gap: 6px 22px; flex: 1; min-width: 0; }
.idfacts div { display: flex; flex-direction: column; min-width: 0; }
.idfacts .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.idfacts .v { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.toggle { border: 1px solid var(--line-strong); background: var(--muted); color: var(--ink); border-radius: 6px; padding: 6px 10px; }
/* app grid */
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 0 24px; padding-inline: 16px; padding-block: 16px 60px; max-width: 1480px; margin: 0 auto; }
.rail { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 18px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail a { text-decoration: none; color: var(--body); padding: 7px 10px; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; }
.rail a.on { background: var(--muted); border-left-color: var(--accent); color: var(--ink); font-weight: 500; }
/* page-1 table of contents: a sticky chip row under the identity bar */
.tocbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 15; display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 8px 0; margin: -4px 0 0; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tocbar::-webkit-scrollbar { display: none; }
.tocbar .kicker { flex: none; margin-right: 4px; }
.tocbar a { flex: none; text-decoration: none; color: var(--dim); font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.tocbar a.on { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
/* the conclusion board: one dense card, label/value rows */
.board-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px 24px; }
@media (max-width: 1000px) { .board-grid { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; align-items: baseline; }
.kv dt { color: var(--dim); font-size: 12px; } .kv dd { margin: 0; color: var(--body); min-width: 0; }
.kv dd b { color: var(--ink); }
table.cores td, table.cores th { padding: 5px 8px; }
table.cores td.sp { width: 120px; padding-block: 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--dim); }
.facts b { color: var(--ink); font-weight: 500; }
.dimrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.dimrow div { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 11.5px; color: var(--dim); background: var(--panel); }
.dimrow b { display: block; color: var(--ink); font-size: 13px; }
@media (max-width: 760px) { .dimrow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kv { grid-template-columns: 78px minmax(0, 1fr); } }
main { min-width: 0; display: flex; flex-direction: column; gap: 28px; }
section.block { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 84px; }
.blockhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.blockhead .n { font-family: var(--mono); color: var(--accent); font-size: 13px; }
.blockhead .sub { color: var(--dim); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card.raised { box-shadow: var(--shadow); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; } .rail { position: static; } .rail nav { flex-direction: row; flex-wrap: wrap; } .g2, .g3, .g4, .g5, .g6 { grid-template-columns: 1fr; } .idfacts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; } .idfacts .v { max-width: 160px; } .tocbar { top: 0; } }
/* stat tiles */
.stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--dim); }
.stat .v { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.stat .s { font-size: 11.5px; color: var(--dim); }
/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line-strong); color: var(--body); background: var(--muted); white-space: nowrap; vertical-align: middle; }
.chip.ok { border-color: var(--ok); color: var(--ok); background: transparent; }
.chip.bad { border-color: var(--bad); color: var(--bad); background: transparent; }
.chip.warn { border-color: var(--warn); color: var(--warn); background: transparent; }
.chip.na { border-style: dashed; color: var(--dim); background: transparent; }
.chip.bull { border-color: var(--up); color: var(--up); background: transparent; }
.chip.bear { border-color: var(--down); color: var(--down); background: transparent; }
.dir-up { color: var(--up); } .dir-down { color: var(--down); } .dir-flat { color: var(--dim); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

.miss { color: var(--warn); font-size: 11px; }

svg.spark { display: block; width: 100%; height: auto; overflow: visible; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark .ln { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spark .ar { opacity: 0.12; }

.note { font-size: 12.5px; color: var(--dim); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; }

.filters select, .filters input { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 160px; }
.steps { display: grid; gap: 6px; }
.steps .row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 80px; gap: 10px; align-items: center; font-size: 12.5px; }
.steps .track { height: 14px; background: var(--muted); border-radius: 3px; position: relative; }
.steps .track i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; min-width: 2px; }
#sankey, #cascade { width: 100%; }
svg.sk { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--sans); }
.sk text { font-size: 11.5px; fill: var(--body); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.sk text.v { fill: var(--dim); font-family: var(--mono); font-size: 10.5px; }
.sk path { fill: none; stroke-opacity: 0.32; transition: stroke-opacity 0.15s; }
.sk path:hover { stroke-opacity: 0.75; }
.sk rect { stroke: var(--panel); stroke-width: 1px; }
.sk rect:hover { filter: brightness(1.15); }
@media (prefers-reduced-motion: reduce) { .sk path { transition: none; } }
.two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }

.pager { display: none; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

    channel: {local: "本地证据", tushare: "TuShare 接口", tushare_news: "TuShare 资讯", official: "官方直连", tavily: "Tavily", exa: "Exa", ai_websearch: "AI WebSearch"},
    outcome: {verified: "补齐", candidate_source: "候选未定", failed: "失败", not_found: "未命中", not_attempted: "未尝试", not_configured: "未启用"},
    fresh: {current: "现行", stale: "过期", awaiting_release: "等待发布", missing: "缺失"},
    status: {completed: "完成", cancelled: "已取消", action_required: "需人工处理", failed: "失败", running: "运行中"},
    cmd: {manual_full: "手动完整运行", report_generation: "报告生成", targeted_refresh: "定向刷新"},
    unit: {percent: "%", index_points: "点", hundred_million_cny: "亿元", diffusion_index_points: "", percentage_points: "pp", usd_per_barrel: "美元/桶", cny_per_usd: "", days: "天", tonne: "吨", barrel: "桶", sheet: "张", lot: "手"},
    ingest: {accepted: "入库接受", rejected: "入库拒收"},

  };
  const fmt = (v, d) => v == null || v === "" ? "—" : (typeof v === "number" ? v.toLocaleString("zh-CN", {maximumFractionDigits: d == null ? 2 : d, minimumFractionDigits: 0}) : String(v));
  const pct = (v, d) => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(d == null ? 2 : d) + "%";
  const unit = (u) => L.unit[u] == null ? (u || "") : L.unit[u];
  const dirArrow = (d) => d === "up" ? '<span class="dir-up">▲</span>' : d === "down" ? '<span class="dir-down">▼</span>' : d === "flat" ? '<span class="dir-flat">▶</span>' : '<span class="dim">·</span>';
  const chip = (t, cls) => `<span class="chip ${cls || ""}">${h(t)}</span>`;
  const rel = (r) => chip(L.relation[r] || r, L.relCls[r] || "");
  const short = (id, n) => id ? id.slice(0, n || 18) + (id.length > (n || 18) ? "…" : "") : "—";
  const ymd = (s) => s ? s.slice(0, 10) : "—";
  const hm = (s) => s ? s.slice(5, 16).replace("T", " ") : "—";
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const assetColor = (a) => a === "bond" ? "var(--bond)" : a === "stock" ? "var(--equity)" : "var(--commodity)";
  const QUAD = {active_restocking: "主动补库存", passive_restocking: "被动补库存", active_destocking: "主动去库存", passive_destocking: "被动去库存", unclassified: "未分类"};
  const quadLabel = (inv) => QUAD[inv.quadrant] || (inv.quadrant == null ? "未分类" : String(inv.quadrant));
  const LINE = {demand: "需求", production: "生产", inventory: "库存"};
  const invLines = (inv) => ["demand", "production", "inventory"].map((ln) => { const c = (inv.cards || []).find((x) => x.line === ln && x.role === "line"); return LINE[ln] + (c ? (c.momentum === "up" ? "↑" : c.momentum === "down" ? "↓" : "→") : "·"); }).join(" ");

  // ---------- sparkline (one scale, labelled ends) ----------
  function spark(points, o) {
    o = o || {};
    const W = o.w || 320, H = o.h || 72, padL = 4, padR = 42, padT = 10, padB = 16;
    const vals = points.map((p) => +p[1]).filter((v) => !isNaN(v));
    if (!vals.length) return `<div class="note">无序列</div>`;
    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (o.line != null) { lo = Math.min(lo, o.line); hi = Math.max(hi, o.line); }
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = (i) => padL + (W - padL - padR) * (points.length === 1 ? 0.5 : i / (points.length - 1));
    const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
    const color = o.color || "var(--accent)";
    let body = "";
    const g1 = y(hi), g2 = y(lo);
    body += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${g1}" y2="${g1}"/><line class="grid" x1="${padL}" x2="${W - padR}" y1="${g2}" y2="${g2}"/>`;
    body += `<text x="${W - padR + 4}" y="${g1 + 3.5}">${fmt(hi, o.d)}</text><text x="${W - padR + 4}" y="${g2 + 3.5}">${fmt(lo, o.d)}</text>`;
    if (o.line != null) body += `<line class="ma" x1="${padL}" x2="${W - padR}" y1="${y(o.line)}" y2="${y(o.line)}"/>`;
    if (o.bars) {
      const bw = Math.max(1, (W - padL - padR) / points.length - 1);
      const y0 = y(Math.max(lo, Math.min(hi, 0)));
      points.forEach((p, i) => { const v = +p[1]; const yy = y(v); body += `<rect class="bar" x="${x(i) - bw / 2}" y="${Math.min(yy, y0)}" width="${bw}" height="${Math.max(1, Math.abs(yy - y0))}" fill="${v >= 0 ? "var(--up)" : "var(--down)"}"/>`; });
    } else {
      const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(+p[1]).toFixed(1)).join(" ");
      body += `<path class="ar" d="${d} L${x(points.length - 1).toFixed(1)} ${y(lo)} L${x(0).toFixed(1)} ${y(lo)} Z" fill="${color}"/>`;
      body += `<path class="ln" d="${d}" stroke="${color}"/>`;
      const last = points[points.length - 1];
      body += `<circle class="end" cx="${x(points.length - 1)}" cy="${y(+last[1])}" r="3.2" fill="${color}"/>`;
      if (o.markers) points.forEach((p, i) => { body += `<circle cx="${x(i)}" cy="${y(+p[1])}" r="2" fill="${color}"/>`; });
    }
    const first = points[0][0], lastP = points[points.length - 1][0];
    body += `<text x="${padL}" y="${H - 3}">${h(String(first).slice(o.dateLen || 0, 10))}</text><text x="${W - padR}" y="${H - 3}" text-anchor="end">${h(String(lastP).slice(o.dateLen || 0, 10))}</text>`;
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(o.label || "走势")}">${body}</svg>`;
  }
  const seg = (parts) => `<div class="seg">${parts.filter((p) => p[0] > 0).map((p) => `<i style="flex:${p[0]};background:${p[1]}" title="${h(p[2])} ${p[0]}"></i>`).join("")}</div>`;
  const hbar = (label, v, max, color, text) => `<div class="hbar"><span>${h(label)}</span><div class="track"><i style="left:${v < 0 ? 50 - Math.min(50, Math.abs(v) / max * 50) : 50}%;width:${Math.min(50, Math.abs(v) / max * 50)}%;background:${color}"></i><i style="left:50%;width:1px;background:var(--line-strong)"></i></div><span class="val">${h(text)}</span></div>`;

  // ---------- identity bar ----------
  $("#idfacts").innerHTML = [
    ["目标交易日", P.meta.target_business_date], ["模型版本", P.meta.model_version_id], ["投影", P.meta.projection_set_id],
    ["完整度", P.meta.completeness === "degraded" ? "降级（有缺口）" : P.meta.completeness], ["分析截止 (UTC)", hm(P.meta.system_as_of)], ["运行", P.meta.run_id], ["页面生成 (UTC)", hm(P.meta.generated_at)],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span class="v mono" title="${h(v)}">${h(v)}</span></div>`).join("");

  // ---------- PAGE 1 ----------
  function board() {
    const ov = P.overview, C = P.confirmation, cores = P.cores;
    const states = cores.map((c) => `${L.asset[c.asset]}${L.state[c.state]}`).join(" · ");
    const relTotal = C.dimensions.reduce((s, d) => s + d.n, 0);
    const sec = (id, n, title, sub, inner) => `<section class="block" id="${id}" aria-labelledby="${id}-h"><div class="blockhead"><span class="n">${n}</span><h2 id="${id}-h">${title}</h2><span class="sub">${sub || ""}</span></div>${inner}</section>`;

    // ① one conclusion board: stage, cores, confirmation, consistency, inventory, attribution
    const pcB = P.price_consistency, invB = P.inventory, baB = P.bond_attribution;
    const coreRows = cores.map((c) => `<tr>
        <td><i class="dot" style="background:${assetColor(c.asset)}"></i><b>${L.asset[c.asset]}</b><span class="sub mono">${h(c.metric_id)}</span></td>
        <td>${chip(L.state[c.state], c.state)}</td>
        <td class="num"><b>${fmt(c.last, c.asset === "stock" ? 1 : 2)}</b></td>
        <td class="num">${pct(c.distance_pct)}</td>
        <td class="num">${pct(c.slope_pct)}</td>
        <td>${L.state[c.candidate_30d]} · ${c.candidate_days} 天</td>
        <td class="num">${pct(c.chg_5d_pct)}</td>
        <td class="num">${pct(c.chg_120d_pct)}</td>
        <td class="sp">${spark(c.points, {w: 120, h: 30, color: assetColor(c.asset), d: 0, label: L.asset[c.asset]}).replace(/<text[^>]*>[^<]*<\/text>/g, "")}</td>
      </tr>`).join("");
    const s1 = `
      <div class="card raised">
        <div class="board-grid">
          <div>
            <p class="kicker">正式阶段</p>
            <h2 style="font-size:30px;margin:2px 0 8px">${ov.current_stage ? "Stage " + ov.current_stage : "暂无正式阶段"}</h2>
            <dl class="kv">
              <dt>原因</dt><dd><b>${L.reason[ov.stage_reason] || ov.stage_reason}</b>：${states}，不在六个典型组合内；不创建 Stage VII/VIII</dd>
              <dt>上次确认</dt><dd>${ov.last_confirmed_stage ? "Stage " + ov.last_confirmed_stage : "无"}</dd>

            </dl>
          </div>
          <div>
            <p class="kicker">确认度</p>
            <h2 style="font-size:22px;margin:2px 0 8px">${C.applicable ? "可评估" : "不适用"} <span class="dim" style="font-size:12.5px;font-weight:400">${relTotal} 项关键指标 · 非典型组合时不计数 · ${h(C.macro_rules_version || P.meta.macro_rules_version)}</span></h2>
            <div class="dimrow">${C.dimensions.map((d) => `<div>${L.dim[d.dimension]}<b>${d.n} 项 · 不适用</b>支 ${d.counts.support} / 反 ${d.counts.counterevidence} / 观 ${d.counts.observation_only} / 未 ${d.counts.unconfirmed}</div>`).join("")}</div>
            <dl class="kv" style="margin-top:10px">
              <dt>价格一致性</dt><dd>${pcB.relative_momentum.map((r) => `${h(r.label)} <b class="num">${(r.value_pp > 0 ? "+" : "") + r.value_pp.toFixed(2)}pp</b>`).join(" · ")}；股市广度 <b>${fmt(pcB.stock_breadth.share, 1)}%</b>（${h(pcB.stock_breadth.text)}）；商品篮子 <b>${pcB.basket_breadth.along}/${pcB.basket_breadth.of}</b> 上涨</dd>
              <dt>库存象限</dt><dd><b>${quadLabel(invB)}</b>（${invB.statistical_period}；${invB.unclassified_by ? "未分类原因：" + h(invB.unclassified_by) : "三线 " + invLines(invB)}）</dd>

            </dl>
          </div>
        </div>
        <div style="overflow-x:auto;margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
          <table class="cores"><thead><tr><th>三核心</th><th>状态</th><th class="num">最新</th><th class="num">距 MA120</th><th class="num">20 日斜率</th><th>30 日候选</th><th class="num">近 5 日</th><th class="num">近 120 日</th><th>120 日走势</th></tr></thead><tbody>${coreRows}</tbody></table>
        </div>
        <div class="facts" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)">
          <span><span class="chip">AI 解读</span> ${h(((P.report.ai_explanation || [])[0] || {explanation: "本次报告无 AI 解读"}).explanation.split("。")[0])}。<a href="#s7">全文</a></span>

    // ② cores
    const ifaceRows = (core) => {

    const pc = P.price_consistency;
    const s2 = `<div class="grid g3">${cores.map((c) => {
      const pcCore = pc.cores.find((x) => x.asset === c.asset) || {};
      let extra = "";
      if (c.asset === "stock") extra = `<div style="margin-top:8px"><p class="note">股市广度：站上 90 日均线个股占比 <b>${fmt(pc.stock_breadth.share, 1)}%</b>（50% 多数线${pc.stock_breadth.share < 50 ? "以下" : "以上"}，${h(pc.stock_breadth.text)}）</p>${spark(P.daily.breadth_ma90, {h: 56, line: 50, d: 0, color: "var(--equity)", label: "广度"})}</div>`;
      if (c.asset === "commodity") extra = `<div style="margin-top:8px"><p class="note">商品篮子分项广度：${pc.basket_breadth.along}/${pc.basket_breadth.of} 上涨，${h(pc.basket_breadth.text)}，篮子 120 日收益 ${pct(pc.basket_breadth.return_pct)}</p><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${pc.basket_breadth.sleeves.map((s) => `<span class="chip ${s.direction === "up" ? "bull" : "bear"}">${h(s.sleeve)} ${s.sum_pp > 0 ? "+" : ""}${s.sum_pp.toFixed(2)}pp</span>`).join("")}</div></div>`;

        ${extra}
        <div style="margin-top:10px;overflow-x:auto">${ifaceRows(c.asset)}</div>
      </div>`; }).join("")}</div>
      <div class="card"><h3>价格内部一致性 <span class="dim" style="font-weight:400;font-size:12px">与阶段同源，不计入确认度 · ${h(pc.formula)} · ${pc.first_session} → ${pc.last_session}</span></h3><div class="grid g2" style="margin-top:8px"><div>${pc.relative_momentum.map((r) => hbar(r.label, r.value_pp, 10, r.value_pp >= 0 ? "var(--up)" : "var(--down)", (r.value_pp > 0 ? "+" : "") + r.value_pp.toFixed(2) + "pp")).join("")}</div><div class="note">阶段位置核对：${pc.position.applicable ? h(pc.position.text) : "不适用（当前无正式阶段，无预期可比）"}。三核心 120 日收益：${pc.cores.map((x) => L.asset[x.asset] + " " + pct(x.return_pct)).join("、")}。</div></div></div>`;

    // ③ international
    const INTL = {CN_USDCNY_CENTRAL_PARITY: "人民币中间价（USD/CNY）", CN_USDCNY_CLOSE_1630: "人民币 16:30 收盘价", CN_USDCNY_ECB_REFERENCE_CROSS: "欧洲央行参考汇率折算", EIA_BRENT_RBRTE: "Brent 原油现货", EIA_WTI_RWTC: "WTI 原油现货", UST10Y_NOMINAL_YIELD: "美债 10 年名义收益率", UST2Y_NOMINAL_YIELD: "美债 2 年名义收益率", UST_2S10S_SPREAD: "美债 2s10s 利差", CBOE_VIX_INDEX: "VIX 波动率指数", NASDAQ_SOX_INDEX: "费城半导体指数（受限授权）"};
    const intl = P.international.filter((e) => INTL[e.metric_id]);
    const s3 = `<div class="tbl-wrap"><table><thead><tr><th>指标</th><th class="num">最新值</th><th>方向</th><th>统计期</th><th>时效</th><th>最近获取</th><th>来源</th></tr></thead><tbody>${intl.map((e) => `<tr><td>${h(INTL[e.metric_id])}<span class="sub mono">${h(e.metric_id)}</span></td><td class="num">${e.value == null ? "—" : fmt(e.value) + " " + unit(e.unit)}</td><td>${dirArrow(e.direction)}</td><td class="mono">${ymd(e.period)}</td><td>${chip(L.fresh[e.status] || e.status || "—", e.status === "current" ? "ok" : e.status ? "warn" : "na")}</td><td>${e.acq.outcome ? chip(L.acqstatus[e.acq.outcome] || e.acq.outcome, e.acq.outcome === "succeeded" ? "ok" : "bad") + ' <span class="dim mono">' + h(e.acq.channel || "") + (e.acq.condition ? " · " + h(e.acq.condition) : "") + "</span>" : '<span class="dim">—</span>'}</td><td class="mono">${h(e.provider || "—")}</td></tr>`).join("")}</tbody></table></div>`;

    // ④ confirmation table

  // ---------- inline SVG sankey (no library): nodes carry a column index; links any columns ----------
  function sankeySVG(nodes, links, o) {
    o = o || {};

    const cols = {}; nodes.forEach((n) => { (cols[n.col] = cols[n.col] || []).push(n); });

      const hs = arr.map((n) => Math.max(2, value[n.id] * scale));
      const total = hs.reduce((s, v) => s + v, 0) + pad * (arr.length - 1);
      let y = o.top === "start" ? 0 : (H - total) / 2;
      arr.forEach((n, i) => { pos[n.id] = {x: x0 + ci * step, y, h: hs[i]}; y += hs[i] + pad; });

    links.slice().sort((a, b) => pos[a.s].y - pos[b.s].y || pos[a.t].y - pos[b.t].y).forEach((l) => { const w = l.v * scale; ty.set(l, pos[l.t].y + (inOff[l.t] || 0) + w / 2); inOff[l.t] = (inOff[l.t] || 0) + w; });

  }

    const fr = P.pipeline.freshness.totals;
    $("#page-runs").innerHTML = `
      <section class="block"><div class="blockhead"><h2>运行状态</h2><span class="sub">单 Worker 串行；外部调用串行；留存期内全部运行</span></div>
        <div class="grid g6">${[["最近运行", short(cur.run_id, 12), L.cmd[cur.command_type]], ["状态", L.status[cur.status] + (cur.outcome ? " · " + (cur.outcome === "changed" ? "投影已更新" : cur.outcome) : ""), "下一步：" + (cur.next_action === "none" ? "无" : cur.next_action)], ["耗时", (totalS / 60).toFixed(1) + " 分钟", "取数 " + (P.steps.find((s) => s.step === "refreshing_evidence").seconds / 60).toFixed(1) + " 分钟"], ["外部请求", P.meta.requests, "失败 " + P.meta.failed_requests], ["检索预算", `T ${cur.budget.tavily}/16 · AI ${cur.budget.ai_websearch}`, "Exa " + cur.budget.exa + "（Tavily 耗尽后顶替）"], ["时效", `现行 ${fr.current || 0} / ${Object.values(fr).reduce((a, b) => a + b, 0)}`, `过期 ${fr.stale || 0} · 等待 ${fr.awaiting_release || 0} · 缺失 ${fr.missing || 0}`]].map(([k, v, s]) => `<div class="stat"><span class="k">${k}</span><span class="v" style="font-size:16px">${v}</span><span class="s">${s}</span></div>`).join("")}</div>
      </section>
      <section class="block"><div class="two">
        <div class="card"><h3>本次运行各环节 <span class="dim mono" style="font-weight:400">${h(cur.run_id)}</span></h3><p class="note" style="margin:4px 0 10px">受理 ${hm(cur.accepted_at)}Z → 取数截止 ${hm(cur.system_as_of)}Z → 完成 ${hm(P.steps[P.steps.length - 1].at)}Z；目标日 ${cur.target_business_date}，${cur.model_version_id}。</p>
          <div class="steps">${P.steps.filter((s) => s.step !== "completed").map((s) => `<div class="row"><span>${L.step[s.step] || s.step}</span><div class="track"><i style="left:0;width:${Math.max(0.6, s.seconds / maxStep * 100).toFixed(1)}%"></i></div><span class="num mono" style="text-align:right">${s.seconds >= 60 ? (s.seconds / 60).toFixed(1) + " 分" : s.seconds.toFixed(1) + " 秒"}</span></div>`).join("")}</div></div>
        <div class="card"><h3>请求按环节</h3><div style="margin-top:8px">${Object.keys(stageTot).sort((a, b) => stageTot[b] - stageTot[a]).map((k) => hbar(k, stageTot[k], Math.max.apply(null, Object.values(stageTot)), /补缺/.test(k) ? "var(--warn)" : "var(--accent)", stageTot[k])).join("")}</div><p class="note" style="margin-top:8px">${h(P.notes.stages)}</p></div>
      </div></section>
      <section class="block"><div class="blockhead"><h2>运行记录</h2><span class="sub">${P.runs.length} 次（留存期内）</span></div>
        <div class="card"><h3 style="font-size:13px;color:var(--dim);font-weight:500">手动完整运行耗时（分钟，按时间先后）</h3><div style="display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px;border-bottom:1px solid var(--line)">${full.map((r) => `<div title="${h(r.run_id)} · ${(r.duration_s / 60).toFixed(1)} 分 · ${r.model_version_id}" style="flex:1;min-width:0;height:${(r.duration_s / maxD * 100).toFixed(0)}%;background:${r.run_id === P.meta.run_id ? "var(--accent)" : r.status === "completed" ? "var(--bond)" : "var(--bad)"};border-radius:2px 2px 0 0;opacity:${r.status === "completed" ? 0.9 : 0.6}"></div>`).join("")}</div><div class="legend" style="margin-top:6px"><span><i class="dot" style="background:var(--accent)"></i>本次</span><span><i class="dot" style="background:var(--bond)"></i>完成</span><span><i class="dot" style="background:var(--bad)"></i>取消 / 需处理</span><span>${full.length} 次，${hm(full[0].accepted_at)} → ${hm(full[full.length - 1].accepted_at)}</span></div></div>
        <div class="tbl-wrap"><table><thead><tr><th>受理 (UTC)</th><th>运行</th><th>类型</th><th>目标日</th><th>模型</th><th>状态</th><th class="num">耗时</th><th class="num">Tavily</th><th class="num">AI</th><th>投影</th><th>下一步</th></tr></thead><tbody>${P.runs.map((r) => `<tr><td class="mono">${hm(r.accepted_at)}</td><td class="mono">${short(r.run_id, 14)}</td><td>${L.cmd[r.command_type] || r.command_type}</td><td class="mono">${r.target_business_date}</td><td class="mono">${r.model_version_id}</td><td>${chip(L.status[r.status] || r.status, r.status === "completed" ? "ok" : r.status === "cancelled" ? "" : "warn")}${r.error_classification ? '<span class="sub mono">' + h(r.error_classification) + "</span>" : ""}</td><td class="num">${r.duration_s == null ? "—" : (r.duration_s / 60).toFixed(1) + " 分"}</td><td class="num">${r.budget.tavily ?? "—"}</td><td class="num">${r.budget.ai_websearch ?? "—"}</td><td class="mono">${r.projection_set_id ? short(r.projection_set_id, 16) : "—"}</td><td>${r.next_action === "none" ? '<span class="dim">无</span>' : h(r.next_action)}</td></tr>`).join("")}</tbody></table></div>
      </section>`;
  }

  // ---------- router & theme ----------
  function route() {
    const hash = location.hash.replace("#", "") || "board";
    const page = hash === "chain" || hash === "runs" ? hash : "board";
    document.querySelectorAll("[data-page]").forEach((el) => { el.hidden = el.dataset.page !== page; });
    document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === page));
    if (page === "chain" && $("#sankey") && !$("#sankey").dataset.drawn) { drawSankey(); drawCascade(); $("#sankey").dataset.drawn = "1"; }
    if (page === "board" && /^s\d$/.test(hash)) { const t = document.getElementById(hash); if (t) t.scrollIntoView(); document.querySelectorAll("#toc a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + hash)); }
    if (page !== "board") window.scrollTo(0, 0);
  }
  board(); chain(); runs();
  window.addEventListener("hashchange", route); route();
  // table of contents highlight on scroll
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) document.querySelectorAll("#toc a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }); }, {rootMargin: "-20% 0px -70% 0px"});
    document.querySelectorAll("#page-board section.block").forEach((s) => io.observe(s));
  }
  const root = document.documentElement, btn = $("#theme");
  const applyTheme = (t) => { if (t) root.setAttribute("data-theme", t); else root.removeAttribute("data-theme"); btn.setAttribute("aria-pressed", String(t === "dark")); };
  try { const saved = localStorage.getItem("proto-theme"); if (saved) applyTheme(saved); } catch (e) {}
  btn.addEventListener("click", () => { const dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches); const next = dark ? "light" : "dark"; applyTheme(next); try { localStorage.setItem("proto-theme", next); } catch (e) {} });
})();
</script>
